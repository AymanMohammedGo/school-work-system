<!DOCTYPE html>
<html lang="ar" dir="rtl" data-logo="unknown">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04211D">
<title>منظومة العمل المدرسي — وزارة التعليم</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ══════════════ AMBIENT FIELD (decorative, never competes with content) ══════════════ -->
<div class="field" aria-hidden="true">
  <span class="field-glow"></span>
  <span class="field-ring field-ring--1"></span>
  <span class="field-ring field-ring--2"></span>
  <span class="field-ring field-ring--3"></span>
  <span class="field-columns"></span>
  <span class="field-vignette"></span>
</div>

<div class="app">

  <!-- ══════════════ IDENTITY RAIL ══════════════ -->
  <header class="rail">
    <div class="lockup">
      <span class="lockup-mark">
        <img class="lockup-img" alt="وزارة التعليم">
      </span>
      <span class="lockup-text">
        <b>وزارة التعليم</b>
        <i>المملكة العربية السعودية</i>
      </span>
    </div>
    <span class="rail-rule"></span>
    <span class="rail-tag">شاشة تفاعلية</span>
  </header>

  <!-- ══════════════ STAGE ══════════════ -->
  <main class="stage" id="stage">

    <svg class="tethers" id="tethers" aria-hidden="true" focusable="false"></svg>

    <!-- CENTRAL IDENTITY CORE -->
    <section class="core" id="core" aria-labelledby="coreTitle">
      <span class="core-halo" aria-hidden="true"></span>
      <div class="core-body">
        <span class="core-mark">
          <img class="core-img" alt="وزارة التعليم">
          <span class="core-word" aria-hidden="true">وزارة التعليم</span>
        </span>
        <span class="core-rule" aria-hidden="true"><i></i><b></b><i></i></span>
        <h1 class="core-title" id="coreTitle">منظومة العمل المدرسي</h1>
        <p class="core-sub">المملكة العربية السعودية</p>
      </div>
    </section>

    <nav class="arc arc--top"    id="arcTop"    aria-label="منظومة العمل المدرسي — الجزء العلوي"></nav>
    <nav class="flank flank--s"  id="flankS"    aria-label="منظومة العمل المدرسي — الجانب الأيمن"></nav>
    <nav class="flank flank--e"  id="flankE"    aria-label="منظومة العمل المدرسي — الجانب الأيسر"></nav>
    <nav class="arc arc--bottom" id="arcBottom" aria-label="منظومة العمل المدرسي — الجزء السفلي"></nav>

  </main>

</div>

<script src="js/app.js"></script>
</body>
</html>
